# The component's persistence defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app / env overrides any of these.
#
# WHY THE WHOLE COMPONENT'S PERSISTENCE IS DECLARED IN THIS ONE JAR, and not half here and half in
# the deployments jar: qits-platform-deployments is ONE database with ONE Flyway lineage, and two
# jars each shipping a file at ordinal 100 that names the same datasource key would make the winner
# arbitrary. This module is the one both others depend on, so it is where "once" can live. The
# persistence unit below therefore lists the entity packages of BOTH domains — the modules are a
# code partition, not a storage one.
#
# The component owns its OWN named datasource + persistence unit + Flyway lineage: a separate
# file-based H2 under ~/.qits/data/platformdeployments, never sharing any other context's DB or
# migration history. Because it is a separate physical DB, a repository, an epic or a ci run is
# named by a plain String rather than by a foreign key. Tests override the url to in-memory H2 (see
# src/test/resources in the service module).
#
# The URL carries NO AUTO_SERVER, for the reason the sibling jars document at length: AUTO_SERVER
# makes the first opener start H2's own TCP server, whose classes are not in the native image, and
# the binary dies at boot on a default no JVM test ever used. A packaged single-process service does
# not need a second process opening the same file.
quarkus.datasource.platformdeployments.db-kind=h2
quarkus.datasource.platformdeployments.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/platformdeployments/h2/platformdeployments

# One persistence unit over both domains' entities. `deployments` depends on `environments` in the
# code; in the database they are four tables in one schema, and a deployment names its service and
# its tier as plain strings with no FK into the topology (see V1__init.sql).
quarkus.hibernate-orm.platformdeployments.datasource=platformdeployments
quarkus.hibernate-orm.platformdeployments.packages=eu.wohlben.qits.platform.deployments.environments.entity,eu.wohlben.qits.platform.deployments.deployments.entity

# Own Flyway lineage at a distinct classpath location. ONE lineage for the component: the merge is a
# clean start, so there is a single V1 and no history inherited from either ancestor.
quarkus.flyway.platformdeployments.migrate-at-start=true
quarkus.flyway.platformdeployments.baseline-on-migrate=true
quarkus.flyway.platformdeployments.locations=classpath:db/platformdeployments/migration

# THERE ARE NO OTHER KEYS IN THIS JAR, and the emptiness is the design. This module shells out to
# nothing and fetches nothing, so it names no runtime binary, no peer's URL and no timeout. Every
# such key belongs to the deployments jar, which is the half that executes.
#
# There is no static machine token anywhere in this component either, and that is a decision rather
# than an omission. Machine callers present a qits-idp bearer — a signed statement of identity
# rather than a shared string. Those keys are the DEPLOYABLE's, not a jar's: they name an identity
# of the deployment, so they sit in the service module's application.properties beside the gate that
# turns enforcement on.
