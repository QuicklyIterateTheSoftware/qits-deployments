# The component's persistence defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app / env overrides any of these.
#
# WHY THE WHOLE COMPONENT'S PERSISTENCE IS DECLARED IN THIS ONE JAR, and not half here and half in
# the deployments jar: qits-platform-deployments is ONE database with ONE Flyway lineage, and two
# jars each shipping a file at ordinal 100 that names the same datasource key would make the winner
# arbitrary. This module is the one both others depend on, so it is where "once" can live. The
# persistence unit below therefore lists the entity packages of BOTH domains — the modules are a
# code partition, not a storage one.
#
# The component owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres
# database, never sharing any other context's DB or migration history. Because it is a separate
# physical DB, a repository, an epic or a ci run is named by a plain String rather than by a foreign
# key. The suites point the same three keys at an embedded postgres (see EmbeddedPgConfigSource in
# the service module's test sources).
#
# THIS COMPONENT IS ADOPTER #1 OF ITS OWN `resources:` CONTRACT. A repository declares
# `resources: postgresql:db` in .config/qits/deployments.yml; this component provisions the role and
# the database before the cutover and injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD into the
# container it starts. Its own deployment spec carries that line, so the three keys below are the
# generic contract read back by the one component that also writes it. Nothing here is
# deployments-specific, which is the whole point: an application maps the generic variables in its
# own shipped defaults and the deployer stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start with the missing name
# in the message rather than opening some fallback store nobody meant. There is no local file to
# fall back to any more: the store moved off H2 wholesale, migrated by unwrap + re-bootstrap, and a
# deployment that has not been given a database has nothing to be usefully started as.
quarkus.datasource.platformdeployments.db-kind=postgresql
quarkus.datasource.platformdeployments.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.platformdeployments.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.platformdeployments.password=${QITS_RESOURCE_DB_PASSWORD}

# One persistence unit over both domains' entities. `deployments` depends on `environments` in the
# code; in the database they are four tables in one schema, and a deployment names its service and
# its tier as plain strings with no FK into the topology (see V1__init.sql).
quarkus.hibernate-orm.platformdeployments.datasource=platformdeployments
quarkus.hibernate-orm.platformdeployments.packages=eu.wohlben.qits.platform.deployments.environments.entity,eu.wohlben.qits.platform.deployments.deployments.entity

# Own Flyway lineage at a distinct classpath location. ONE lineage for the component: the move to
# postgres is a clean start, so there is a single V1 and no history inherited from the H2 lineage or
# from either ancestor.
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this
# code now meets is either empty or was created by this very lineage, and the flag would only mask
# the one case worth failing on — a schema somebody else put there.
quarkus.flyway.platformdeployments.migrate-at-start=true
quarkus.flyway.platformdeployments.locations=classpath:db/platformdeployments/migration

# THERE ARE NO OTHER KEYS IN THIS JAR, and the emptiness is the design. This module shells out to
# nothing and fetches nothing, so it names no runtime binary, no peer's URL and no timeout. Every
# such key belongs to the deployments jar, which is the half that executes.
#
# There is no static machine token anywhere in this component either, and that is a decision rather
# than an omission. Machine callers present a qits-idp bearer — a signed statement of identity
# rather than a shared string. Those keys are the DEPLOYABLE's, not a jar's: they name an identity
# of the deployment, so they sit in the service module's application.properties beside the gate that
# turns enforcement on.
