# Follow a qits-auth-core release, the same way qits-ci and qits-artifacts do.
#
# Three services depend on that package — those two and this one — and this repo went without the
# pipeline for a release cycle. The gap is worth naming: a release moved the other two and left the
# DEPLOYER pinned to the version before it. That is the wrong one of the three to leave behind — it
# is the service whose health gate decides whether anything else can be deployed at all, and the
# service that would have to redeploy qits-idp.
#
# The bump lands on a maintenance branch, not on main: a release of a shared library is not a
# decision to deploy every dependent, and merging is where that decision is made.
event: SoftwareRelease
when:
  - repository: { exact: qits-integrations-quarkus }
    packageType: { exact: maven }
    packageName: { exact: "eu.wohlben.qits:qits-auth-core" }
steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 600
    script: |
      set -eu
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-auth-core/$version/qits-auth-core-$version.pom"
      sed -i -E "s#<qits.auth-core.version>[^<]+</qits.auth-core.version>#<qits.auth-core.version>$version</qits.auth-core.version>#" pom.xml
      git add pom.xml
      git diff --cached --quiet && exit 0
      git -c user.name="qits release train" -c user.email="release-train@qits.local" commit -q \
        -m "bump(qits-auth-core@$version): follow qits-integrations-quarkus"
      git push --force "$QITS_CI_REPOSITORY_URL" HEAD:refs/heads/maintenance/qits-integrations-quarkus
