# How this repository is deployed. It is read from the git host at the built sha.
#
# This component is an ENVIRONMENT service: one instance per environment, deploying that
# environment. It owns the topology and the docker socket, and one environment's copy answers for
# one environment — which is what a per-tier deployer is for. It used to be a platform service,
# back when one instance served every tier.
#
# `deployment_target` is omitted because `environment` is the default, and a default written out is
# a second place to keep it right.
#
# `deploy_branches` is what the release flow promotes onto; the deployer itself takes no notice of
# it — a green build deploys wherever an environment listens to the built branch, and that is the
# environment row's answer, not this file's.
deploy_branches: environment/prod

# The convention would derive the health path from the repository name, but the route path
# deliberately did not move with the rename — the service still serves /platform-deployments. Without this line
# the deployer probes a 404 and rolls every deployment back as unhealthy.
health_path: /platform-deployments/q/health/ready
