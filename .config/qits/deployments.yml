# How this repository is deployed. It is read from the git host at the built sha.
# qits-platform-deployments is a platform service: one instance owns the topology and executes every
# environment's deployments, so a per-tier copy would be a per-tier answer to a platform-wide
# question — and a second one would be a second docker socket.
#
# No `branch:`, so it deploys from the platform plane's convention, `platform/main` — the mirror of a
# tier's `environment/<name>`. `main` stays the integration trunk and ships nothing; a release
# reaches the platform by fast-forwarding `platform/main` onto it.
deployment_target: platform
