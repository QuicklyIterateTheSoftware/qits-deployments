# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# This component is an ENVIRONMENT service: one instance per environment, deploying that
# environment. It owns the topology and the docker socket, and one environment's copy answers for
# one environment — which is what a per-tier deployer is for. It used to be a platform service,
# back when one instance served every tier.
#
# `deployment_target` is omitted because `environment` is the default, and a default written out is
# a second place to keep it right. Where a green build deploys is the environment row's answer and
# never this file's, so nothing here states it.
#
# ONE KEY, and it is the component describing itself with its own mechanism. This repo's
# store is PostgreSQL, and the line below is what provisions it: a role and a database of its own on
# the tier's postgres, created before the successor container starts, injected as
# QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD — the generic contract, which the environments jar's
# datasource defaults read verbatim.
#
# ADOPTER #1, AND THE ONE THAT CANNOT PROVISION ITSELF FROM COLD. The bootstrap creates this role
# and this database over plain JDBC before this process exists, and BootResourceRegistration records
# what it was handed at every boot — so the first self-deploy after that finds a registry row, takes
# the no-op arm, and is injected the credential it is already connected with. Without the row it
# would rotate its own password out from under its own connection pool.
resources: postgresql:db
