# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One step, two halves, and the split between them is the whole point:
#
#   1. build the web client (service/src/main/webui = the qits-spa-deployments submodule) HERE, in the step
#      container, which can reach the platform's own npm registry — where @qits/ui-components lives
#      and where nothing else can reach it from;
#   2. build this repo's docker/Dockerfile, whose builder stage packages that already-built bundle
#      and never runs an install.
#
# The step needs node, npm and git for half one and the docker CLI for half two. The same split, for
# the same reason, as every other SPA-serving service's pipeline — they should keep matching.
#
# Publish it under the tag that is the whole contract with the deployer —
# <registry>/<repository>/<this repo's name>:<sha>. The step's own container only drives the docker
# CLI; the build and the push happen in the host's daemon through the socket this step declares
# (docker: true). A failed push is a failed step is a FAILED run, so the CD announcement (SUCCESS
# only) keeps implying "the image exists".
#
# THIS REPO IS ALSO THE DEPLOYER: a green run here announces qits-deployments to itself, and under
# swarm it deploys ITSELF — the manager arbitrates the succession and the surviving instance's sweep
# records the outcome (README, "Self-update takes an orchestrator"). Nothing in this file changes
# for that; it is worth knowing because the /platform-deployments surface blips mid-cutover, and a
# successor that misses its health gate leaves the predecessor serving.
#
# This repo deploys as an ENVIRONMENT service (.config/qits/deployments.yml): one instance per
# environment, deploying that environment. The deploy refs are `environment/<name>` and nothing
# else — a push to one of them is a deployment here, a push to `main` builds and ships nothing, the
# same as on every other repo.
steps:
  - image: qits/build-images/node-docker-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push fails, `docker rmi || true` answers 0, the run reports SUCCESS, and the
      # deployer is told an image exists that does not (the exact shape of the qits-workspaces
      # IMAGE_MISSING incident). -u is load-bearing too: an unset registry var must stop the step,
      # not quietly resolve the @qits scope against npmjs.org, where these packages do not exist and
      # never will.
      set -eu

      # The daemon's shallow clone does not recurse, so initialise the packaged SPA explicitly.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-spa-deployments"
      git -c submodule.qits-spa-deployments.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. Same problem
      # and same fix as qits-spa-deployments' own pipeline — that repo's recipe is where this
      # pattern is maintained, and the two should keep matching.
      #
      # npm pins a full resolved URL per package, and qits-spa-deployments' lockfile is generated on
      # the deployment host, so every entry names a localhost port — an address that does not exist
      # in this container. `npm ci` fetches tarballs by that URL and never asks the configured
      # registry for them, so the environment below does not reach them: without this swap the
      # install dies on connection refused. The paths are identical on every address, so replacing
      # the ORIGIN and keeping the path is all it takes, and the integrity hashes are what make that
      # safe — bytes from the other address must still hash the same. The checkout is this step's
      # own; nothing is edited that anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES SINCE THE SPLIT, WHICH IS WHY THE SWAP READS THE PATH.
      # qits-platform-mirror holds the npmjs pull-through cache; qits-artifacts hosts the @qits
      # scope. No single origin serves both, so the path is what tells them apart: an entry under
      # the hosted registry's own pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a
      # @qits tarball and gets the hosted origin, and every other entry gets the proxy's. One sed
      # covered both roots while they shared an origin; since the split it sends every @qits tarball
      # to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either.
      # @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-platform-mirror:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz
      # comes out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball
      # 404s. Measured on npm 10.9.4.
      #
      # Every address is derived from the injected env rather than spelled here: no repository
      # states a deployment's addresses, and the two qits-spa-deployments does state
      # (registry.dev.localhost:8080 for the @qits scope and mirror.dev.localhost:8080 for npmjs, in
      # its .npmrc, for a developer on the host) are the ones being replaced.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-spa-deployments COMMITS an .npmrc (registry.dev.localhost:8080
      # for @qits and mirror.dev.localhost:8080 for npmjs, right for a developer on the host), and
      # npm ranks a project .npmrc ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written
      # and silently ignored. `npm_config_*` environment outranks both files, so it wins without
      # touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-deployments/browser — the bundle the image build consumes (it is
      # quarkus.quinoa.build-dir in service/src/main/resources/application.properties), and the ONE
      # artifact this half exists to produce. Lint and test are qits-spa-deployments's own pipeline's job;
      # repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # --network host, NOT a custom network: buildkit (the builder format the platform targets — a
      # swarm cannot assume the legacy builder) refuses custom networks on a build. Host networking
      # is buildkit-supported, and the maven registry's host-published address is derived from the
      # same injected env the image tag uses, so no address is stated here.
      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-deployments:$QITS_CI_SHA"
      docker build --network host \
        --build-arg QITS_MAVEN_REPOSITORY_URL="http://$QITS_REGISTRY/artifacts/maven/maven" \
        -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      # NO `docker rmi "$ref"`: on a CI host it frees nothing — the layers stay in the builder's
      # cache either way — while under the containerd image store it drops the last reference to
      # content a concurrent build of this same Dockerfile may still be resolving. Two builds of
      # this one Dockerfile do run concurrently, main's and environment/dev's, which is the race
      # that broke the release of 2026-08-11.

  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      set -eu
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac
      summary=$(git log -1 --format=%s)
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ branch, summary }),
        }).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
        }).catch((err) => {
          console.error(`release call failed: ${err.message}`);
          process.exit(1);
        });
      ' "$QITS_WORKSPACES_URL/workspaces/api/branches/release?repositoryId=$QITS_CI_REPO_ID" \
        "$QITS_CI_BRANCH" "$summary"
